<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Serial Database - Login</title>
    <link rel="stylesheet" href="css/prihlaseni_a_registr_styl.css">
</head>
<body>
    <div class="container">

        <!--LOGIN-->
        <div id="loginForm" class="form-wrapper active">
            <h2>Login</h2>
            <form action="login.php" method="POST">
                <div class="form-group">
                    <label for="login_user">Username</label>
                    <input type="text" name="login" id="login_user" required>
                </div>
                <div class="form-group">
                    <label for="login_pass">Password</label>
                    <input type="password" id="login_pass" name="password" required>
                </div>
                <button type="submit">Log In</button>
            </form>
            <div class="under-text">
                    Don't have an account? <a onclick="toggleForms()">Sign up</a>
            </div>
        </div>

        <!--REGISTER-->
        <div id="registerForm" class="form-wrapper">
            <h2>Registration</h2>
            <form action="register.php" method="POST" enctype="multipart/form-data">
                <div class="form-group">
                    <label for="name">First Name</label>
                    <input type="text" name="name" id="name" required pattern="[A-Za-zÀ-ž\s\-]+" title="Please enter a valid name (letters only)" placeholder="e.g. John">
                </div>
                <div class="form-group">
                    <label for="surname">Last Name</label>
                    <input type="text" name="surname" id="surname" required pattern="[A-Za-zÀ-ž\s\-]+" title="Please enter a valid surname (letters only)" placeholder="e.g. Doe">
                </div>
                <div class="form-group">
                    <label for="email">E-mail</label>
                    <input type="email" name="email" id="email" required placeholder="name@example.com">
                </div>
                <div class="form-group">
                    <label for="phone_number">Phone Number</label>
                    <input type="tel" id="phone_number" name="phone_number" required pattern="[0-9+\s]{9,15}" title="Please enter a valid phone number (9-15 digits, optionally starting with +)" placeholder="+420 123 456 789">
                </div>
                <div class="form-group">
                    <label for="gender">Gender</label>
                    <select name="gender" id="gender" required>
                        <option value="male">Male</option>
                        <option value="female">Female</option>
                        <option value="other">Other</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="pfp">Profile Picture</label>
                    <input type="file" name="pfp" id="pfp" accept="image/*" required>
                </div>
                <div class="form-group">
                    <label for="reg_login">Username</label>
                    <input type="text" name="reg_login" id="reg_login" required pattern="[a-zA-Z0-9_]{4,20}" title="Login must be 4-20 characters long (letters, numbers, underscores only)" placeholder="username123">
                </div>
                <div class="form-group">
                    <label for="reg_pass">Password</label>
                    <input type="password" name="password" id="reg_pass" required minlength="8" title="Password must be at least 8 characters long" placeholder="Min. 8 characters">
                </div>
                <button type="submit">Create Account</button>
            </form>
            <div class="under-text">
                Already have an account? <a onclick="toggleForms()">Log in</a>
            </div>
        </div>

    </div>


    <script>
        function toggleForms() {
            const loginForm = document.getElementById('loginForm');
            const registerForm = document.getElementById('registerForm');
            
            if (loginForm.classList.contains('active')) {
                loginForm.classList.remove('active');
                setTimeout(() => registerForm.classList.add('active'), 200);
            } else {
                registerForm.classList.remove('active');
                setTimeout(() => loginForm.classList.add('active'), 200);
            }
        }
    </script>
</body>
</html>
</body>
</html>

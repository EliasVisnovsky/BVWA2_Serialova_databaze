<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Serial Database - Login</title>
    <link rel="stylesheet" href="css/prihlaseni_a_registr_styl.css">
</head>
<body>
    <div class="container">

        <!--LOGIN-->
        <div id="loginForm" class="form-wrapper active">
            <h2>Login</h2>
            <div id="loginInfo" class="alert alert-success" role="status" hidden></div>
            <form action="login.php" method="POST">
                <div class="form-group">
                    <label for="login_user">Username</label>
                    <input type="text" name="login" id="login_user" required>
                </div>
                <div class="form-group">
                    <label for="login_pass">Password</label>
                    <input type="password" id="login_pass" name="password" required>
                </div>
                <button type="submit">Log In</button>
            </form>
            <div class="under-text">
                    Don't have an account? <a onclick="toggleForms()">Sign up</a>
            </div>
            <div class="under-text">
                <a href="index.php">Continue without logging in</a>
            </div>
        </div>

        <!--REGISTER-->
        <div id="registerForm" class="form-wrapper">
            <h2>Registration</h2>
            <form id="registerFormEl" action="register.php" method="POST" enctype="multipart/form-data" novalidate>
                <div id="registerAlert" class="alert alert-error" role="alert" hidden></div>
                <div class="form-group">
                    <label for="name">First Name</label>
                    <input type="text" name="name" id="name" required maxlength="50" placeholder="e.g. John">
                </div>
                <div class="form-group">
                    <label for="surname">Last Name</label>
                    <input type="text" name="surname" id="surname" required maxlength="50" placeholder="e.g. Doe">
                </div>
                <div class="form-group">
                    <label for="email">E-mail</label>
                    <input type="email" name="email" id="email" required maxlength="254" placeholder="name@example.com">
                </div>
                <div class="form-group">
                    <label for="phone_number">Phone Number</label>
                    <input type="tel" id="phone_number" name="phone_number" required placeholder="+420 123 456 789">
                </div>
                <div class="form-group">
                    <label for="gender">Gender</label>
                    <select name="gender" id="gender" required>
                        <option value="male">Male</option>
                        <option value="female">Female</option>
                        <option value="other">Other</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="pfp">Profile Picture</label>
                    <input type="file" name="pfp" id="pfp" accept="image/jpeg,image/png,image/webp" required>
                    <small class="hint">JPEG, PNG or WebP, max 2 MB, at least 200 x 200 px.</small>
                </div>
                <div class="form-group">
                    <label for="reg_login">Username</label>
                    <input type="text" name="reg_login" id="reg_login" required placeholder="username123">
                </div>
                <div class="form-group">
                    <label for="reg_pass">Password</label>
                    <input type="password" name="password" id="reg_pass" required placeholder="8-64 characters, a letter and a digit">
                </div>
                <button type="submit">Create Account</button>
            </form>
            <div class="under-text">
                Already have an account? <a onclick="toggleForms()">Log in</a>
            </div>
        </div>

    </div>


    <script>
        function toggleForms() {
            const loginForm = document.getElementById('loginForm');
            const registerForm = document.getElementById('registerForm');
            
            if (loginForm.classList.contains('active')) {
                loginForm.classList.remove('active');
                setTimeout(() => registerForm.classList.add('active'), 200);
            } else {
                registerForm.classList.remove('active');
                setTimeout(() => loginForm.classList.add('active'), 200);
            }
        }
    </script>
    <script>
        // Hlášky po přesměrování z login.php / logout.php / ze stránek, které vyžadují přihlášení
        (function () {
            const kod = new URLSearchParams(location.search).get('login');
            const zpravy = {
                chyba:     ['Wrong username or password.', 'alert-error'],
                nutne:     ['Please log in to continue.', 'alert-error'],
                odhlaseno: ['You have been logged out.', 'alert-success']
            };
            if (!kod || !zpravy[kod]) return;
            const box = document.getElementById('loginInfo');
            box.textContent = zpravy[kod][0];
            box.className = 'alert ' + zpravy[kod][1];
            box.hidden = false;
            history.replaceState(null, '', location.pathname);
        })();
    </script>
    <script src="js/validace.js"></script>
    <script src="js/registrace.js"></script>
</body>
</html>
